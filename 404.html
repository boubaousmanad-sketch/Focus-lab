<title>Focus &amp; Performance</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<script>
  /* GitHub Pages : une adresse inconnue, ou la racine du site, renvoie vers la page vitrine. */
  (function () {
    if (/coach\.html$/.test(location.pathname)) return;
    var seg = location.pathname.split('/')[1];
    var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
    location.replace(base + 'coach.html');
  })();
</script>

  html{background:#000;color:#edeae3;color-scheme:dark;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1.0625rem;line-height:1.55}

</style>
</head>
